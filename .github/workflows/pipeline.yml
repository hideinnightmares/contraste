# Corre el pipeline: lee las fuentes, agrupa y verifica los hechos, redacta borradores con Gemini y
# los guarda en la base para la mesa de redacción. Ver docs/AUTOMATIZACION.md, "Corrida programada".
#
# Cuándo corre:
# - cada 2 horas, de 8 a 22 de Buenos Aires, solo si la variable del repositorio
#   CONTRASTE_PIPELINE_ACTIVO vale "true" (así se activa y se pausa sin tocar el código);
# - a mano, desde la pestaña Actions, aunque la variable no esté (para probarlo). Con la opción
#   "Solo comprobar las claves", dice si los secretos están cargados y funcionan, sin leer fuentes,
#   redactar ni guardar.
#
# Secretos: GEMINI_API_KEY (Google AI Studio) y SUPABASE_SECRET_KEY (la clave secreta de Supabase,
# sb_secret_…). La dirección de la base y la del sitio salen de .env.production.
#
# Variables opcionales: CONTRASTE_MAX_BORRADORES_POR_CORRIDA (4 si no se define),
# CONTRASTE_MINUTOS_POR_CORRIDA (4: pasado ese tiempo no se empieza otro borrador),
# CONTRASTE_REVIEW_MODE ("human" si no se define: todo pasa por la mesa), CONTRASTE_GEMINI_PLAN
# ("pago" cuando se contrate el plan pago de Gemini) y CONTRASTE_GEMINI_RAZONAMIENTO ("bajo" si no
# se define; ver docs/AUTOMATIZACION.md).
#
# Cupo: unos 3 minutos facturados por corrida, 8 corridas por día (ver docs/DESPLIEGUE.md). El
# trabajo se corta a los 10 minutos aunque algo se cuelgue.
name: Pipeline de noticias

on:
  schedule:
    - cron: '23 11-23/2 * * *' # 08:23 a 20:23 de Buenos Aires, cada 2 horas
    - cron: '23 1 * * *' # 22:23 de Buenos Aires
  workflow_dispatch:
    inputs:
      solo_verificar:
        description: 'Solo comprobar las claves (Gemini y la base), sin redactar ni guardar'
        type: boolean
        default: false

# Una corrida a la vez: dos juntas podrían redactar el mismo hecho, porque cada una lee al empezar
# qué notas ya existen.
concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    if: github.event_name == 'workflow_dispatch' || vars.CONTRASTE_PIPELINE_ACTIVO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Memoria entre corridas: título, resumen y dirección de las notas de las últimas 24 horas
      # (no su texto). Cada feed muestra solo sus últimas notas; con la memoria, un hecho que dos
      # medios publican con horas de diferencia se puede contrastar. Ver src/pipeline/memory.ts.
      - name: Recuperar la memoria de la corrida anterior
        if: ${{ !inputs.solo_verificar }}
        uses: actions/cache/restore@v6
        with:
          path: .cache/pipeline
          key: pipeline-memoria-${{ github.run_id }}
          restore-keys: pipeline-memoria-

      # Solo dice si cada secreto existe (nunca su valor) y avisa si una clave quedó cargada como
      # variable: las variables no son secretas y su valor se ve en los registros.
      - name: Ver dónde están cargadas las claves
        if: ${{ inputs.solo_verificar }}
        env:
          SECRETO_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
          SECRETO_SUPABASE: ${{ secrets.SUPABASE_SECRET_KEY != '' }}
          VARIABLE_GEMINI: ${{ vars.GEMINI_API_KEY != '' }}
          VARIABLE_SUPABASE: ${{ vars.SUPABASE_SECRET_KEY != '' }}
        run: |
          echo "Secreto GEMINI_API_KEY cargado: $SECRETO_GEMINI"
          echo "Secreto SUPABASE_SECRET_KEY cargado: $SECRETO_SUPABASE"
          if [ "$VARIABLE_GEMINI" = true ] || [ "$VARIABLE_SUPABASE" = true ]; then
            echo "::warning::Hay una clave cargada como variable y no como secreto. Borrala de Variables y cargala en Secrets."
          fi

      - name: Correr el pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CONTRASTE_MAX_BORRADORES_POR_CORRIDA: ${{ vars.CONTRASTE_MAX_BORRADORES_POR_CORRIDA || 4 }}
          CONTRASTE_MINUTOS_POR_CORRIDA: ${{ vars.CONTRASTE_MINUTOS_POR_CORRIDA || 4 }}
          CONTRASTE_REVIEW_MODE: ${{ vars.CONTRASTE_REVIEW_MODE || 'human' }}
          CONTRASTE_GEMINI_PLAN: ${{ vars.CONTRASTE_GEMINI_PLAN }}
          CONTRASTE_GEMINI_RAZONAMIENTO: ${{ vars.CONTRASTE_GEMINI_RAZONAMIENTO }}
          CONTRASTE_MEMORIA: .cache/pipeline/memoria.json
          # El registro de Actions es público: solo cantidades y errores, sin títulos ni direcciones.
          # El detalle de cada hecho queda en el informe guardado en la base (pipeline_runs).
          CONTRASTE_REGISTRO: resumen
        run: npm run pipeline -- ${{ inputs.solo_verificar && '--verificar' || '--write --save' }}

      - name: Guardar la memoria para la próxima corrida
        if: ${{ always() && !inputs.solo_verificar && hashFiles('.cache/pipeline/memoria.json') != '' }}
        uses: actions/cache/save@v6
        with:
          path: .cache/pipeline
          key: pipeline-memoria-${{ github.run_id }}
